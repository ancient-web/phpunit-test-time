services:
  tests:
    build:
      context: .
    image: ancient-web/phpunit-test-time
    working_dir: /app
    # Run as the host user so files written to the live-mounted working copy
    # (vendor/, caches, composer.lock) are owned by you, not root. HOME is
    # pointed at a writable directory so git and composer have a usable config.
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      HOME: /tmp
    # The whole repo is live-mounted; the entrypoint reconciles vendor/ with
    # composer.lock on every run, so no vendor volume is needed.
    volumes:
      - .:/app
    command: ["vendor/bin/phpunit"]
